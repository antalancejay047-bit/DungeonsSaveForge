
name: Build DungeonsSaveForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Checking repository files..."
          find . -maxdepth 5 -type f \
            ! -path './.git/*' | sort | head -200

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            ! -path './.git/*' \
            ! -path '*/.gradle/*' \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            echo "Make sure you uploaded the extracted Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found. Installing Gradle 8.7..."

            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          mkdir -p apk-output

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

          echo "Generated APK files:"
          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonsSaveForge-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
