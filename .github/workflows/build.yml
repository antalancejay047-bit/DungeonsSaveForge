
name: Build DungeonsSaveForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE="DungeonsSaveForge-GEAR-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."
          echo "Files found:"
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(realpath "$SETTINGS_FILE")")

          echo "Found Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          mkdir -p apk-output

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -exec cp {} apk-output/ \;

          if [ -z "$(ls -A apk-output)" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          ls -lh apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonsSaveForge-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
