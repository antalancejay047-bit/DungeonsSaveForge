
name: Build Dungeons Save Forge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android SDK
        run: |
          sdkmanager --version
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Extract project ZIP
        run: |
          unzip -q DungeonsSaveForge-Android-Project.zip -d extracted

          cp -R extracted/DungeonsSaveEditorAndroid/app .
          cp extracted/DungeonsSaveEditorAndroid/build.gradle .
          cp extracted/DungeonsSaveEditorAndroid/settings.gradle .
          cp extracted/DungeonsSaveEditorAndroid/gradle.properties .

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp

      - name: Build APK
        run: |
          /tmp/gradle-8.7/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonsSaveForge-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
